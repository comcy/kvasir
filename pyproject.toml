[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimirlink"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "textual>=0.60",
    "gitpython>=3.1",
    "python-frontmatter>=1.1",
    "mistune>=3",
    "libtmux>=0.28",
    "watchdog>=4",
    "apscheduler>=3.10",
    "plyer>=2",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
mimirlink = "src.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
